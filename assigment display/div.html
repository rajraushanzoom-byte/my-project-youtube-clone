<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
display:grid;
background-color:red;
    grid-template-columns: 1fr 1fr 1fr;
    height:100px;
    width:100px;
    color:red;

    }
    .box{
        display:grid;
background-color:green;
    grid-template-columns: 1fr 1fr 1fr;
    height:100px;
    width:100px;
    color:green;
    }
</style>
</head>
<body>
    <div class="container">
1fr
    </div>
    <div class="box">
        2fr
    </div>
</body>
</html>
